<body>
<div id="saved" class="saved">Tersimpan</div>
<div class="wrap">
  <header class="header"><button class="btn danger" id="newTournament">Turnamen Baru</button></header>
  <nav class="tabs" id="mainTabs"><button class="btn secondary tab active" data-tab="players">Tabel Tier Pemain</button><button class="btn secondary tab" data-tab="rules">Aturan Handicap</button><button class="btn secondary tab" data-tab="bracket">Bagan Pertandingan</button><button class="btn secondary tab" data-tab="history">Riwayat Turnamen</button><button class="btn secondary tab" data-tab="control">Kontrol Match</button></nav>
  <main id="app"></main>
</div>
<script>
const KEY='biliar-local-v1', RACE=3;
const initial=()=>({players:[],participants:['',''],format:'single',raceTo:3,matches:[],champion:'',started:false,tournamentId:'',tournamentName:'',startedAt:'',completedAt:'',tournaments:[]});
let data=load(), tab='players';
function raceTarget(){return Math.max(1,Math.min(15,Number(data.raceTo)||3))}
function matchRace(m){return Math.max(1,Math.min(15,Number(m&&m.raceTo)||3))}
function load(){try{return {...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return initial()}}
function save(){const n=document.getElementById('saved');try{localStorage.setItem(KEY,JSON.stringify(data));if(n){n.textContent='Tersimpan';n.style.display='block';clearTimeout(window._st);window._st=setTimeout(()=>n.style.display='none',700)}return true}catch(error){console.error('Penyimpanan gagal',error);if(n){n.textContent='Gagal menyimpan. Ekspor backup sekarang.';n.style.display='block'}if(!window._storageWarning){window._storageWarning=true;alert('Data belum berhasil disimpan di browser. Gunakan Ekspor Backup sebelum menutup aplikasi.')}return false}}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function player(name){return data.players.find(p=>p.name===name)}
function rule(m){const a=player(m.player1),b=player(m.player2);if(!a||!b)return null;const gap=Math.abs(a.tier-b.tier);return{gap,low:a.tier<b.tier?a:b}}
function power2(n){let x=1;while(x<n)x*=2;return x}
function label(r,t){const x=t-r;return x===0?'Final':x===1?'Semifinal':x===2?'Perempat Final':`Babak ${r}`}
function single(count){const size=power2(Math.max(2,count)),total=Math.log2(size),out=[];for(let r=1;r<=total;r++){for(let p=0;p<size/2**r;p++)out.push({id:`s-${r}-${p}`,round:r,position:p,label:label(r,total),player1:'',player2:'',score1:0,score2:0,winner:'',loser:'',completed:false,nextMatchId:r<total?`s-${r+1}-${Math.floor(p/2)}`:null,nextSlot:p%2===0?'player1':'player2'})}return out}
function doubleFirst(count){return Array.from({length:Math.ceil(count/2)},(_,p)=>({id:`d-1-${p}`,round:1,position:p,label:'Putaran 1',player1:'',player2:'',score1:0,score2:0,winner:'',loser:'',completed:false}))}

function buildDoubleBracket(count,names){
 const size=power2(Math.max(2,count)),ur=Math.log2(size),lr=Math.max(1,2*ur-2),matches=[];
 const shuffled=shuffleList(names), firstCount=size/2;
 // Sebarkan satu pemain ke setiap pertandingan terlebih dahulu.
 // Dengan 9 pemain pada bagan 16, hasilnya 7 kartu BYE berisi tepat 1 nama
 // dan 1 pertandingan berisi 2 nama, tanpa kartu putaran pertama yang kosong.
 const firstSlots=Array.from({length:firstCount},()=>[]);
 shuffled.slice(0,firstCount).forEach((name,i)=>firstSlots[i].push(name));
 shuffled.slice(firstCount).forEach((name,i)=>firstSlots[i%firstCount].push(name));
 for(let i=0;i<firstCount;i++)matches.push({id:`AR1.${i+1}`,code:`AR1.${i+1}`,section:'upper',round:1,position:i,label:'Atas R1',player1:firstSlots[i][0]||'',player2:firstSlots[i][1]||'',source1:'',source2:'',score1:0,score2:0,winner:'',loser:'',completed:false});
 for(let r=2;r<=ur;r++)for(let i=0;i<size/2**r;i++){const src=upperSources(r,i);matches.push({id:`AR${r}.${i+1}`,code:`AR${r}.${i+1}`,section:'upper',round:r,position:i,label:r===ur?'Final Bagan Atas':`Atas R${r}`,player1:'',player2:'',source1:src[0],source2:src[1],score1:0,score2:0,winner:'',loser:'',completed:false})}
 for(let r=1;r<=lr&&size>2;r++)for(let i=0;i<lowerMatchCount(count,r);i++){const src=lowerSources(count,r,i);matches.push({id:`BR${r}.${i+1}`,code:`BR${r}.${i+1}`,section:'lower',round:r,position:i,label:r===lr?'Final Bagan Bawah':`Bawah R${r}`,player1:'',player2:'',source1:src[0],source2:src[1],score1:0,score2:0,winner:'',loser:'',completed:false})}
 matches.push({id:'GF.1',code:'GF.1',section:'final',round:1,position:0,label:'Grand Final',player1:'',player2:'',source1:`Pemenang AR${ur}.1`,source2:size===2?'Kalah AR1.1':`Pemenang BR${lr}.1`,score1:0,score2:0,winner:'',loser:'',completed:false});
 return propagateDouble(matches);
}
function resolveSource(matches,text){const code=sourceCode(text);if(!code)return'';const m=matches.find(x=>x.code===code||x.id===code);if(!m||!m.completed)return'';return text.startsWith('Kalah')?m.loser:m.winner}
function sourceFinished(matches,text){
 if(!text)return true;
 const code=sourceCode(text);if(!code)return true;
 const source=matches.find(x=>x.code===code||x.id===code);
 return Boolean(source&&source.completed);
}
function propagateDouble(matches){
 let changed=true;
 while(changed){
  changed=false;
  matches.forEach(m=>{
   if(m.completed)return;
   const a=m.source1?resolveSource(matches,m.source1):m.player1;
   const b=m.source2?resolveSource(matches,m.source2):m.player2;
   if(a&&!m.player1){m.player1=a;changed=true}
   if(b&&!m.player2){m.player2=b;changed=true}

   const source1Ready=sourceFinished(matches,m.source1);
   const source2Ready=sourceFinished(matches,m.source2);
   const hasOnePlayer=Boolean(m.player1)!==Boolean(m.player2);

   // BYE: hanya satu pemain dan semua sumber pertandingan sudah selesai.
   // Pemain otomatis maju sebagai pemenang tanpa mencatat pemain kalah.
   if((hasOnePlayer||(!m.player1&&!m.player2))&&source1Ready&&source2Ready){
    m.winner=m.player1||m.player2;
    m.loser='';
    m.completed=true;
    m.bye=true;
    changed=true;
   }
  });
 }
 return matches;
}
function seeded(){return data.matches.filter(m=>m.round===1).flatMap(m=>[m.player1,m.player2]).filter(Boolean)}
function losses(){const x={};data.matches.forEach(m=>{if(m.completed&&m.loser)x[m.loser]=(x[m.loser]||0)+1});return x}
function nextDouble(names,loss,r){const ordered=[...names].sort((a,b)=>(loss[a]||0)-(loss[b]||0)),out=[];for(let i=0;i<ordered.length;i+=2){const a=ordered[i]||'',b=ordered[i+1]||'';out.push({id:`d-${r}-${i/2}`,round:r,position:i/2,label:`Putaran ${r}`,player1:a,player2:b,score1:0,score2:0,winner:a&&!b?a:'',loser:'',completed:Boolean(a&&!b)})}return out}


function shuffleList(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function participantNames(){return (data.participants||[]).filter(Boolean)}
function fillFirstRound(matches,names){const shuffled=shuffleList(names), first=matches.filter(m=>m.round===1);let k=0;first.forEach(m=>{m.player1=shuffled[k++]||'';m.player2=shuffled[k++]||''});return matches}
function processSingleByes(matches){
 let changed=true;
 while(changed){changed=false;for(const m of matches){
  if(m.completed)continue;
  const sources=matches.filter(x=>x.nextMatchId===m.id);
  if(m.round>1&&(sources.length!==2||sources.some(x=>!x.completed)))continue;
  if(m.player1&&m.player2)continue;
  m.winner=m.player1||m.player2||'';m.loser='';m.completed=true;m.bye=true;changed=true;
  if(m.nextMatchId){const next=matches.find(x=>x.id===m.nextMatchId);if(next)next[m.nextSlot]=m.winner;}
 }}return matches;
}
function doubleLayout(count){
 const size=power2(Math.max(2,count)), upperRounds=Math.log2(size), sections={upper:[],lower:[],final:[]};
 for(let r=1;r<=upperRounds;r++){
  const n=size/2**r;
  sections.upper.push({title:r===upperRounds?'Final Bagan Atas':`Atas R${r}`,matches:Array.from({length:n},(_,i)=>({label:`A${r}.${i+1}`}))});
 }
 const lowerRounds=Math.max(1,2*upperRounds-2);
 for(let r=1;r<=lowerRounds;r++){
  const n=Math.max(1,Math.floor(size/2**(Math.floor((r+1)/2)+1)));
  sections.lower.push({title:r===lowerRounds?'Final Bagan Bawah':`Bawah R${r}`,matches:Array.from({length:n},(_,i)=>({label:`B${r}.${i+1}`}))});
 }
 sections.final.push({title:'Grand Final',matches:[{label:'GF'}]});
 return sections;
}
function raceEditor(m){const value=matchRace(m);return `<label class="cardRaceEditor"><span>Race to</span><input class="racePerMatch" type="number" min="1" max="15" step="1" value="${value}" data-id="${m.id}"></label>`;}
function ghostMatch(code,kind,source1,source2){return `<div class="match ghost nodeCard ${kind==='final'?'grandCard':''}" data-node="${code}"><div class="row between muted"><span class="nodeCode">${code}</span><span>Race to ${raceTarget()}</span></div><div class="slot miniSlot"><div><div class="waiting">Menunggu</div><div class="sourceText">${source1}</div></div></div><div class="slot miniSlot"><div><div class="waiting">Menunggu</div><div class="sourceText">${source2}</div></div></div><button class="btn finishPlaceholder" disabled>Selesai</button></div>`}
function upperRoundsFor(count){return Math.log2(power2(Math.max(2,count)))}
function lowerRoundCount(count){return Math.max(1,2*upperRoundsFor(count)-2)}
function upperMatchCount(count,r){return power2(Math.max(2,count))/2**r}
function lowerMatchCount(count,r){const size=power2(Math.max(2,count));return Math.max(1,Math.floor(size/2**(Math.floor((r+1)/2)+1)))}
function upperSources(r,i){return r===2?[`Pemenang AR1.${i*2+1}`,`Pemenang AR1.${i*2+2}`]:[`Pemenang AR${r-1}.${i*2+1}`,`Pemenang AR${r-1}.${i*2+2}`]}
function lowerSources(count,r,i){
 if(r===1)return [`Kalah AR1.${i*2+1}`,`Kalah AR1.${i*2+2}`];
 if(r%2===0)return [`Pemenang BR${r-1}.${i+1}`,`Kalah AR${Math.floor(r/2)+1}.${i+1}`];
 return [`Pemenang BR${r-1}.${i*2+1}`,`Pemenang BR${r-1}.${i*2+2}`];
}
function sourceCode(text){const m=text.match(/(?:Pemenang|Kalah)\s+([A-Z]+\d+\.\d+)/);return m?m[1]:''}
function doubleMatchCard(m){

function alignAdvancingMatches(){
 const canvas=document.getElementById('doubleCanvas');if(!canvas)return;
 const compact=canvas.classList.contains('laterRoundsFocus');
 const baseRound=compact?Number(canvas.dataset.baseRound||2):1;
 const nodes=[...canvas.querySelectorAll('[data-node]')];
 const parse=code=>{const m=String(code||'').match(/^([A-Z]+)(\d+)\.(\d+)$/);return m?{section:m[1],round:Number(m[2]),match:Number(m[3])}:null};

 // Reset semua posisi sebelum menghitung ulang.
 nodes.forEach(node=>{node.style.setProperty('--align-y','0px');node.style.zIndex='2'});

 const ordered=nodes.map(node=>({node,info:parse(node.dataset.node)}))
  .filter(x=>x.info)
  .sort((a,b)=>{
   const sectionOrder={AR:1,BR:2,GF:3};
   return (sectionOrder[a.info.section]||9)-(sectionOrder[b.info.section]||9)
    ||a.info.round-b.info.round||a.info.match-b.info.match;
  });

 ordered.forEach(({node,info})=>{
  // Mode normal: R1 menjadi dasar. Mode padat: R2 Atas dan R2 Bawah
  // menjadi dasar yang disusun rapat. R3 dan seterusnya mengikuti titik tengah sumber.
  if(info.section!=='GF'){
   if(!compact&&info.round<=1)return;
   if(compact&&info.round<=baseRound)return;
  }

  const sourceCodes=[node.dataset.source1||'',node.dataset.source2||''].map(sourceCode).filter(Boolean);
  const sourceNodes=sourceCodes.map(code=>canvas.querySelector(`[data-node="${code}"]`)).filter(Boolean);
  const sameLane=sourceNodes.filter(source=>{const parsed=parse(source.dataset.node);return parsed&&parsed.section===info.section});

  if(alignmentSources.length!==2)return;

  const centers=alignmentSources.map(source=>{const r=source.getBoundingClientRect();return r.top+r.height/2});
  const desiredCenter=(centers[0]+centers[1])/2;
  const targetRect=node.getBoundingClientRect();
  const targetCenter=targetRect.top+targetRect.height/2;
  node.style.setProperty('--align-y',`${desiredCenter-targetCenter}px`);
 });
}
function alignLowerFinalWithSources(){

function bringLowerBracketCloser(){

 if(!canvas.classList.contains('laterRoundsFocus'))return;

 if(!upperBase||!lowerBase)return;

 if(!upperCards.length||!lowerCards.length)return;

function updateDynamicBracketDensity(){
 const canvas=document.getElementById('doubleCanvas');
 const scroller=document.getElementById('bracketScroller');
 if(!canvas||!scroller)return;
 const columns=[...canvas.querySelectorAll('.flowColumn:not(.grandColumn)')];
 const firstColumn=columns.find(col=>(col.getAttribute('style')||'').includes('grid-column:1;'));
 const colWidth=firstColumn?firstColumn.getBoundingClientRect().width:235;
 const area=getComputedStyle(canvas.querySelector('.doubleArea'));
 const colGap=parseFloat(area.columnGap)||54;
 const step=Math.max(1,colWidth+colGap);
 // R1 menjadi dasar saat scroll di kiri. Setelah satu lebar kolom terlewati,
 // R2 menjadi dasar; setelah dua kolom, R3 menjadi dasar, dan seterusnya.
 const baseRound=Math.max(1,Math.floor((scroller.scrollLeft+step*.22)/step)+1);
 const compact=baseRound>1;
 canvas.dataset.baseRound=String(baseRound);
 canvas.classList.toggle('laterRoundsFocus',compact);
 scroller.classList.toggle('isCompact',compact);
 canvas.style.setProperty('--dynamic-density',compact?'0.66':'1');
 columns.forEach(col=>{
  const match=(col.getAttribute('style')||'').match(/grid-column:(\d+)/);
  const round=match?Number(match[1]):1;
  col.classList.toggle('beforeBaseRound',compact&&round<baseRound);
  col.classList.toggle('baseRound',round===baseRound);
  col.classList.toggle('afterBaseRound',round>baseRound);
 });
}

function drawConnectors(){
 const canvas=document.getElementById('doubleCanvas'),svg=document.getElementById('connectorSvg');if(!canvas||!svg)return;
 const box=canvas.getBoundingClientRect();
 const width=Math.max(canvas.scrollWidth,box.width),height=Math.max(canvas.scrollHeight,box.height);
 svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('width',width);svg.setAttribute('height',height);
 svg.style.width=`${width}px`;svg.style.height=`${height}px`;svg.innerHTML='';
 canvas.querySelectorAll('[data-node]').forEach(target=>{
  const targetCode=target.dataset.node||'';
  [target.dataset.source1||'',target.dataset.source2||''].forEach(sourceText=>{
   const code=sourceCode(sourceText);if(!code)return;
   if(code.startsWith('AR')&&targetCode.startsWith('BR'))return;
   const source=canvas.querySelector(`[data-node="${code}"]`);if(!source)return;
   const a=source.getBoundingClientRect(),b=target.getBoundingClientRect();
   const x1=a.right-box.left+canvas.scrollLeft;
   const y1=a.top+a.height/2-box.top+canvas.scrollTop;
   const x2=b.left-box.left+canvas.scrollLeft;
   const y2=b.top+b.height/2-box.top+canvas.scrollTop;
   const mid=x1+Math.max(14,(x2-x1)/2);
   const path=document.createElementNS('http://www.w3.org/2000/svg','path');
   const sourceIsLower=code.startsWith('BR');
   const targetIsLower=targetCode.startsWith('BR');
   const lowerRoute=sourceIsLower||targetIsLower;
   path.setAttribute('class',`connectorPath ${lowerRoute?'lowerConnector':'upperConnector'}`);
   const directUpperFinalToGrand=targetCode==='GF.1'&&code.startsWith('AR');
   const dy=y2-y1,dx=x2-x1;if(directUpperFinalToGrand){path.setAttribute('d',`M ${x1} ${y1} L ${x2} ${y2}`)}else if(Math.abs(dy)<10){path.setAttribute('d',`M ${x1} ${y1} H ${x2}`)}else{const rr=Math.min(8,Math.abs(dy)/2,Math.abs(dx)/3);const dir=dy>0?1:-1;path.setAttribute('d',rr<3?`M ${x1} ${y1} H ${mid} V ${y2} H ${x2}`:`M ${x1} ${y1} H ${mid-rr} Q ${mid} ${y1} ${mid} ${y1+dir*rr} V ${y2-dir*rr} Q ${mid} ${y2} ${mid+rr} ${y2} H ${x2}`)}
   path.setAttribute('vector-effect','non-scaling-stroke');svg.appendChild(path);
   [[x1,y1],[x2,y2]].forEach(([x,y])=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class',`connectorDot ${lowerRoute?'lowerConnectorDot':'upperConnectorDot'}`);c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r','3');svg.appendChild(c)});
  });
 });
}

function finish(id){

  if(m.nextMatchId){const n=data.matches.find(x=>x.id===m.nextMatchId);n[m.nextSlot]=m.winner}else data.champion=m.winner;

function rememberResult(){data.resultHistory=[...(data.resultHistory||[]),resultSnapshot()].slice(-20)}
function undoLastResult(){

 rememberBracketScroll();const targets=new Map(data.matches.map(m=>[m.id,m.raceTo]));
 const snapshot=history.pop();data.matches=snapshot.matches;data.matches.forEach(m=>{if(targets.has(m.id))m.raceTo=targets.get(m.id)});data.champion=snapshot.champion;save();render();
}
function downloadBackup(){

 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-biliar-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function validateBackup(raw){

 if(!d||!Array.isArray(d.players)||!Array.isArray(d.participants)||!Array.isArray(d.matches)||!['single','double'].includes(d.format)||typeof d.started!=='boolean')throw Error('Struktur backup tidak sesuai.');
 if(d.players.length>10000||d.matches.length>10000||d.participants.length>10000)throw Error('Jumlah data terlalu besar.');
 const names=new Set();for(const p of d.players){if(!p||typeof p.name!=='string'||!p.name.trim()||names.has(p.name)||!Number.isFinite(Number(p.tier)))throw Error('Database pemain tidak valid.');names.add(p.name)}
 if(d.participants.some(n=>typeof n!=='string'||(n&&!names.has(n))))throw Error('Peserta tidak ditemukan di database pemain.');
 const ids=new Set();for(const m of d.matches){if(!m||typeof m.id!=='string'||ids.has(m.id)||typeof m.player1!=='string'||typeof m.player2!=='string'||typeof m.completed!=='boolean'||![m.score1,m.score2].every(v=>Number.isFinite(v)&&v>=0))throw Error('Data pertandingan tidak valid.');ids.add(m.id)}
 for(const m of d.matches){if(m.nextMatchId&&!ids.has(m.nextMatchId))throw Error('Referensi pertandingan tidak valid.');if(d.format==='double')for(const src of [m.source1,m.source2])if(src&&!ids.has(sourceCode(src)))throw Error('Sumber bagan tidak ditemukan.');}
 for(const m of d.matches){if(m.shot){const t=m.shot;for(const k of ['normal','first','breakTime','extension','quota','foulLimit','remaining','deadline'])if(!Number.isFinite(t[k])||t[k]<0||t[k]>(k==='deadline'?1e15:k==='remaining'?1e9:3600))throw Error('Pengaturan timer tidak valid.');for(const k of ['used','fouls','streak'])if(!Array.isArray(t[k])||t[k].length!==2||t[k].some(x=>!Number.isInteger(x)||x<0))throw Error('Counter timer tidak valid.');if(![0,1].includes(t.turn)||!['normal','first','break'].includes(t.mode)||typeof t.running!=='boolean')throw Error('Status timer tidak valid.');}}
 const clean={...initial()};for(const key of Object.keys(clean))if(Object.prototype.hasOwnProperty.call(d,key))clean[key]=d[key];
 // History from external files is not executed or trusted; start a fresh undo stack.
 if(d.tournaments!==undefined){
 if(!Array.isArray(d.tournaments)||d.tournaments.length>2000)throw Error('Riwayat turnamen tidak valid.');
 const archiveIds=new Set();clean.tournaments=d.tournaments.map(a=>{if(!a||typeof a.id!=='string'||archiveIds.has(a.id)||typeof a.name!=='string'||typeof a.completedAt!=='string'||!Number.isFinite(Date.parse(a.completedAt))||!a.snapshot||!a.snapshot.champion)throw Error('Arsip turnamen tidak valid.');archiveIds.add(a.id);const snapshot=validateBackup({...a.snapshot,tournaments:[]});return {id:a.id,name:a.name,completedAt:a.completedAt,snapshot};});
 }

    try {
      return localStorage.getItem(ROLE_KEY) === 'operator' ? 'operator' : 'viewer'
    } catch (e) {
      return 'viewer'
    }
  })()

  // ------------------------------------------------------------------- util
  function headers() {
    return {
      apikey: CONFIG.anonKey,
      Authorization: 'Bearer ' + CONFIG.anonKey,
      'Content-Type': 'application/json',
    }
  }

  function endpoint(query) {
    return CONFIG.url.replace(/\/$/, '') + '/rest/v1/' + TABLE + (query || '')
  }

  /**
   * Sebuah baris baru berisi `{}`, dan pemuatan pertama yang belum diisi
   * menghasilkan state awal tanpa isi. Keduanya bukan data turnamen, jadi
   * tidak boleh dipakai menimpa data lokal yang sudah tersusun.
   */
  function isEmptyPayload(payload) {
    if (!payload || typeof payload !== 'object') return true
    if (Object.keys(payload).length === 0) return true
    var players = Array.isArray(payload.players) ? payload.players.length : 0
    var matches = Array.isArray(payload.matches) ? payload.matches.length : 0
    var tournaments = Array.isArray(payload.tournaments) ? payload.tournaments.length : 0
    if (players > 0 || matches > 0 || tournaments > 0) return false
    if (payload.champion) return false
    var name = typeof payload.tournamentName === 'string' ? payload.tournamentName.trim() : ''
    return name.length === 0
  }

  function stamp(iso) {    if (!iso) return '—'
    try {
      return new Date(iso).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    } catch (e) {
      return String(iso)
    }
  }

  // -------------------------------------------------------------------- UI
  var chip = null
  var statusEl = null

  function mountUi() {
    var style = document.createElement('style')
    style.textContent = [
      '#syncChip{position:fixed;right:14px;bottom:14px;z-index:9999;display:flex;gap:8px;align-items:center;',
      'font:600 13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;padding:9px 13px;border-radius:999px;',
      'border:1px solid rgba(0,0,0,.15);background:#fff;color:#111;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer}',
      '#syncChip.op{background:#0f766e;color:#fff;border-color:#0f766e}',
      '#syncStatus{position:fixed;left:14px;bottom:14px;z-index:9999;font:500 11px/1.4 system-ui,sans-serif;',
      'padding:6px 10px;border-radius:8px;background:rgba(17,17,17,.78);color:#fff;max-width:60vw}',
      '#syncStatus.bad{background:#b91c1c}',
      '@media(max-width:520px){#syncChip{right:10px;bottom:10px;padding:8px 11px}#syncStatus{left:10px;bottom:10px}}',
    ].join('')
    document.head.appendChild(style)

    chip = document.createElement('button')
    chip.id = 'syncChip'
    chip.type = 'button'
    chip.addEventListener('click', toggleRole)
    document.body.appendChild(chip)

    statusEl = document.createElement('div')
    statusEl.id = 'syncStatus'
    document.body.appendChild(statusEl)
    paint()
  }

  function paint(extra) {
    if (chip) {
      chip.className = role === 'operator' ? 'op' : ''
      chip.textContent = role === 'operator' ? '✏️ Operator' : '👁 Penonton'
      chip.title =
        role === 'operator'
          ? 'Perangkat ini boleh mengubah bracket. Klik untuk keluar dari mode operator.'
          : 'Perangkat ini hanya melihat. Klik untuk masuk mode operator (perlu PIN).'
    }
    if (statusEl) {
      var parts = []
      if (!configured()) {
        parts.push('Sinkronisasi belum diatur — data hanya di perangkat ini.')
      } else if (!online) {
        parts.push('Offline — memakai data lokal.')
      } else if (!lastRemoteAt) {
        parts.push('Menunggu data dari operator…')
      } else {
        parts.push('Tersambung • diperbarui ' + stamp(lastRemoteAt))
      }
      if (extra) parts.push(extra)
      statusEl.textContent = parts.join(' ')
      statusEl.className = configured() && online ? '' : 'bad'
    }
  }

  function toast(message, bad) {
    if (!statusEl) return
    statusEl.textContent = message
    statusEl.className = bad ? 'bad' : ''
    clearTimeout(toast._t)
    toast._t = setTimeout(function () {
      paint()
    }, 2600)
  }

  function toggleRole() {
    if (role === 'operator') {
      role = 'viewer'
      try {
        localStorage.setItem(ROLE_KEY, role)
      } catch (e) {}
      paint()
      toast('Mode penonton: perubahan tidak akan tersimpan.')
      return
    }
    var entered = window.prompt('Masukkan PIN operator:')
    if (entered === null) return
    if (String(entered) !== String(CONFIG.pin)) {
      toast('PIN salah.', true)
      return
    }
    role = 'operator'
    try {
      localStorage.setItem(ROLE_KEY, role)
    } catch (e) {}
    paint()
    toast('Mode operator aktif di perangkat ini.')
    // Operator langsung mengunggah state lokal supaya perangkat lain terisi.
    if (configured() && !lastRemoteAt) push()
  }

  // ----------------------------------------------------------- remote calls
  function pull() {
    return fetch(endpoint('?id=eq.' + encodeURIComponent(CONFIG.room) + '&select=payload,updated_at'), {
      headers: headers(),
      cache: 'no-store',
    })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status)
        return response.json()
      })
      .then(function (rows) {
        online = true
        return Array.isArray(rows) && rows.length > 0 ? rows[0] : null
      })
      .catch(function (error) {
        online = false
        paint()
        throw error
      })
  }

  function push() {
    if (!configured() || role !== 'operator') return Promise.resolve()
    if (busy) {
      // Kiriman sebelumnya belum selesai; pastikan state terbaru ikut terkirim.
      pending = true
      return Promise.resolve()
    }
    busy = true
    var body = JSON.stringify([{ id: CONFIG.room, payload: data }])
    return fetch(endpoint(), {
      method: 'POST',
      headers: Object.assign({}, headers(), {
        Prefer: 'resolution=merge-duplicates,return=representation',
      }),
      body: body,
      cache: 'no-store',
    })
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status)
        return response.json()
      })
      .then(function (rows) {
        online = true
        var row = Array.isArray(rows) && rows.length > 0 ? rows[0] : null
        if (row && row.updated_at) lastRemoteAt = row.updated_at
        lastPayload = JSON.parse(JSON.stringify(data))
        paint()
      })
      .catch(function (error) {
        online = false
        paint('Gagal mengirim: ' + (error && error.message ? error.message : 'tidak diketahui'))
      })
      .then(function () {
        busy = false
        if (pending) {
          pending = false
          schedulePush()
        }
      })
  }

  function schedulePush() {
    clearTimeout(pushTimer)
    pushTimer = setTimeout(function () {
      push().catch(function () {})
    }, CONFIG.debounceMs)
  }

  // --------------------------------------------------------- apply & reload
  function applyRemote(row) {
    if (!row || !row.payload) return
    if (isEmptyPayload(row.payload)) return
    if (lastRemoteAt && row.updated_at && row.updated_at <= lastRemoteAt) return
    lastRemoteAt = row.updated_at || new Date().toISOString()
    lastPayload = row.payload
    try {
      data = Object.assign(initial(), row.payload)
      rawSave() // simpan ke cache lokal tanpa memicu push
      render()
    } catch (error) {
      console.warn('[sync] gagal menerapkan data dari server', error)
    }
    paint()
  }

  function poll() {
    if (!configured() || document.hidden) return
    pull()
      .then(function (row) {
        if (!row || isEmptyPayload(row.payload)) {
          paint()
          return
        }
        applyRemote(row)
      })
      .catch(function () {
        /* status sudah diperbarui di pull() */
      })
  }

  // ------------------------------------------------------------- patch save
  window.save = function () {
    if (role !== 'operator') {
      // Kembalikan tampilan ke versi server supaya tidak tampak seolah tersimpan.
      if (lastPayload) {
        try {
          data = Object.assign(initial(), lastPayload)
          render()
        } catch (error) {}
      }
      toast('Mode penonton — perubahan tidak disimpan. Klik tombol Penonton untuk jadi operator.', true)
      return false
    }
    var ok = rawSave()
    if (ok && configured()) schedulePush()
    return ok
  }

  // ---------------------------------------------------------------- startup
  mountUi()

  window.addEventListener('online', function () {
    online = true
    paint()
    poll()
  })
  window.addEventListener('offline', function () {
    online = false
    paint()
  })
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) poll()
  })

  if (!configured()) {
    paint()
    return
  }

  // Tarik data terbaru lebih dulu; kalau server masih kosong dan perangkat ini
  // operator, unggah state lokal.
  pull()
    .then(function (row) {
      if (row && !isEmptyPayload(row.payload)) applyRemote(row)
      else if (role === 'operator') push()
      else paint()
    })
    .catch(function () {
      paint('Tidak bisa menghubungi Supabase — memakai data lokal.')
    })

  pollTimer = setInterval(poll, CONFIG.pollMs)
  window.addEventListener('beforeunload', function () {
    clearInterval(pollTimer)
  })
})()
</script>
<!-- ===== Shell tampilan ===== -->
<script>
/* =====================================================================
 * Shell tampilan: sidebar navigasi, judul halaman, dan penyesuaian seluler.
 * Dijalankan setelah aplikasi & lapisan sinkronisasi.
 * Tidak mengubah logika turnamen: setiap klik hanya meneruskan klik ke
 * tombol tab asli yang tetap ada di DOM.
 * ===================================================================== */
;(function () {
  'use strict'

  var app = document.getElementById('app')
  if (!app) return

  var ICONS = {
    players: '<circle cx="9" cy="8" r="3.2"/><path d="M2.8 20c0-3.2 2.8-5.6 6.2-5.6s6.2 2.4 6.2 5.6"/><path d="M16.4 5.2a3.2 3.2 0 0 1 0 6.2"/><path d="M18 14.6c2.1.7 3.4 2.4 3.4 4.6"/>',
    rules: '<path d="M4 7h16M4 12h16M4 17h10"/><circle cx="8" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="11" cy="17" r="2"/>',
    bracket: '<rect x="9" y="2.5" width="6" height="5" rx="1.4"/><rect x="2.5" y="16.5" width="6" height="5" rx="1.4"/><rect x="15.5" y="16.5" width="6" height="5" rx="1.4"/><path d="M12 7.5v3.5M5.5 16.5V13h13v3.5"/>',
    history: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.4V12l3.2 2"/>',
    control: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1.1"/>',
    save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/>',
    download: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/>',
    upload: '<path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M4 4h16"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
  }

  /** Aksi cepat yang dipindahkan dari bilah atas ke sidebar. */
  var ACTIONS = [
    { id: 'saveTournament', icon: 'save' },
    { id: 'exportBackup', icon: 'download' },
    { id: 'importBackup', icon: 'upload' },
  ]

  var TABS = [
    { id: 'players', label: 'Pemain & Tier', code: 'Pemain' },
    { id: 'rules', label: 'Aturan Handicap', code: 'Aturan' },
    { id: 'bracket', label: 'Bagan Pertandingan', code: 'Bagan' },
    { id: 'history', label: 'Riwayat Turnamen', code: 'Riwayat' },
    { id: 'control', label: 'Kontrol Match', code: 'Kontrol' },
  ]

  function icon(name) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'
  }

  // ------------------------------------------------------------------ DOM
  var nav = document.createElement('aside')
  nav.className = 'nav'
  nav.id = 'appNav'
  nav.innerHTML = [
    '<div class="nav-brand">',
    '  <div class="nav-logo">🎱</div>',
    '  <div>',
    '    <div class="nav-title">Manajer Turnamen</div>',
    '    <div class="nav-sub" id="navSub">Biliar</div>',
    '  </div>',
    '</div>',
    '<div>',
    '  <div class="nav-group-label">Menu</div>',
    '  <div class="nav-list" id="navList">',
    TABS.map(function (t) {
      return (
        '<button type="button" class="nav-item" data-target="' + t.id + '">' +
        icon(t.id) + '<span>' + t.label + '</span></button>'
      )
    }).join(''),
    '  </div>',
    '</div>',
    '<div class="nav-foot" id="navFoot">',
    '  <button type="button" class="nav-new" id="navNew">Turnamen Baru</button>',
    '</div>',
  ].join('')

  var toggle = document.createElement('button')
  toggle.type = 'button'
  toggle.className = 'nav-toggle'
  toggle.setAttribute('aria-label', 'Buka menu')
  toggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'

  var backdrop = document.createElement('div')
  backdrop.className = 'nav-backdrop'

  document.body.appendChild(nav)
  document.body.appendChild(toggle)
  document.body.appendChild(backdrop)

  // ------------------------------------------------------------- page head
  var wrap = document.querySelector('.wrap')
  var head = document.createElement('div')
  head.className = 'page-head'
  head.innerHTML =
    '<div><div class="page-eyebrow" id="pageEyebrow">Turnamen</div>' +
    '<h1 class="page-title" id="pageTitle">Pemain &amp; Tier</h1></div>' +
    '<div class="page-meta" id="pageMeta"></div>'
  if (wrap && wrap.firstChild) wrap.insertBefore(head, wrap.firstChild)
  else if (wrap) wrap.appendChild(head)

  var pageEyebrow = head.querySelector('#pageEyebrow')
  var pageTitle = head.querySelector('#pageTitle')
  var pageMeta = head.querySelector('#pageMeta')
  var navSub = nav.querySelector('#navSub')
  var navItems = Array.prototype.slice.call(nav.querySelectorAll('.nav-item'))

  // ------------------------------------------------------------ sinkron UI
  function currentTab() {
    var active = document.querySelector('.tab.active')
    if (active && active.dataset && active.dataset.tab) return active.dataset.tab
    return 'players'
  }

  function state() {
    try {
      return typeof data === 'object' && data ? data : {}
    } catch (error) {
      return {}
    }
  }

  function refresh() {
    var tabId = currentTab()
    var entry = null
    for (var i = 0; i < TABS.length; i += 1) if (TABS[i].id === tabId) entry = TABS[i]
    if (!entry) entry = TABS[0]

    navItems.forEach(function (item) {
      item.classList.toggle('is-active', item.dataset.target === entry.id)
    })

    if (pageTitle) pageTitle.textContent = entry.label
    if (pageEyebrow) pageEyebrow.textContent = 'Turnamen Biliar'

    var d = state()
    var name = (d.tournamentName || '').trim()
    var players = Array.isArray(d.players) ? d.players.length : 0
    var parts = []
    if (name) parts.push(name)
    if (players > 0) parts.push(players + ' pemain')
    if (d.champion) parts.push('Juara: ' + d.champion)
    if (pageMeta) pageMeta.textContent = parts.join(' · ')
    if (navSub) navSub.textContent = name || 'Biliar'
    annotateGenerate()
    ensureBracketJump()
  }

  /**
   * Jelaskan kenapa tombol "Acak & Generate Bagan" masih mati, supaya tidak
   * terlihat seperti aplikasi yang rusak.
   */
  function annotateGenerate() {
    var button = document.getElementById('generateRandom')
    var existing = document.getElementById('generateHint')

    if (!button || !button.disabled) {
      if (existing) existing.remove()
      return
    }

    var d = state()
    var rows = Array.isArray(d.participants) ? d.participants : []
    var valid = rows.filter(Boolean)
    var unique = new Set(valid).size === valid.length
    var reason =
      valid.length < 2
        ? 'Pilih minimal 2 peserta untuk membuat bagan.'
        : 'Ada nama yang sama di dua slot — hapus salah satunya.'

    if (!existing) {
      existing = document.createElement('div')
      existing.id = 'generateHint'
      existing.className = 'generate-hint'
      button.insertAdjacentElement('afterend', existing)
    }
    existing.textContent = reason
    button.title = reason
  }

  /**
   * Tombol "Grand Final" untuk melompat ke ujung kanan bagan. Bracket panjang
   * membuat kolom final mudah terlewat karena tertutup gulir.
   */
  var jumpBound = false

  function ensureBracketJump() {
    var scroller = document.getElementById('bracketScroller')
    var existing = document.getElementById('jumpGrandFinal')

    if (!scroller) {
      if (existing) existing.remove()
      return
    }

    var scrollable = scroller.scrollWidth - scroller.clientWidth > 80
    if (!scrollable) {
      if (existing) existing.remove()
      return
    }

    if (!existing) {
      var host = scroller.parentElement
      if (host && getComputedStyle(host).position === 'static') host.style.position = 'relative'

      existing = document.createElement('button')
      existing.id = 'jumpGrandFinal'
      existing.type = 'button'
      existing.className = 'bracket-jump'
      existing.textContent = 'Grand Final →'
      existing.addEventListener('click', function () {
        scroller.scrollTo({ left: scroller.scrollWidth, behavior: 'smooth' })
      })
      if (host) host.appendChild(existing)

      if (!jumpBound) {
        jumpBound = true
        scroller.addEventListener('scroll', ensureBracketJump, { passive: true })
      }
    }

    var atEnd = scroller.scrollLeft + scroller.clientWidth >= scroller.scrollWidth - 60
    existing.classList.toggle('is-hidden', atEnd)
  }

  // Klik sidebar diteruskan ke tombol tab asli.
  navItems.forEach(function (item) {
    item.addEventListener('click', function () {
      var target = item.dataset.target
      var real = document.querySelector('.tab[data-tab="' + target + '"]')
      if (real) {
        real.click()
      } else {
        try {
          tab = target
          render()
        } catch (error) {
          console.warn('[ui] tidak bisa berpindah tab', error)
        }
      }
      document.body.classList.remove('nav-open')
      setTimeout(refresh, 0)
    })
  })

  var navNew = nav.querySelector('#navNew')
  if (navNew) {
    navNew.addEventListener('click', function () {
      var real = document.getElementById('newTournament')
      if (real) real.click()
      document.body.classList.remove('nav-open')
    })
  }

  // ------------------------------- aksi cepat: pindahkan dari bilah atas
  var bar = document.getElementById('backupTools')
  if (bar) {
    var versionNote = bar.querySelector('span.muted')
    if (versionNote) versionNote.remove()

    var actionsWrap = document.createElement('div')
    actionsWrap.className = 'nav-actions'
    actionsWrap.innerHTML = '<div class="nav-group-label">Aksi</div>'

    ACTIONS.forEach(function (action) {
      var button = document.getElementById(action.id)
      if (!button) return
      var label = (button.textContent || '').trim()
      button.classList.add('nav-action')
      button.innerHTML = icon(action.icon) + '<span>' + label + '</span>'
      actionsWrap.appendChild(button)
    })

    var actionsFoot = nav.querySelector('#navFoot')
    if (actionsWrap.querySelectorAll('button').length > 0) {
      nav.insertBefore(actionsWrap, actionsFoot)
    }

    // "Turnamen Baru" ikut ke grup aksi, dengan warna peringatan.
    var newButton = nav.querySelector('#navNew')
    if (newButton) {
      newButton.classList.remove('nav-new')
      newButton.classList.add('btn', 'nav-action', 'is-danger')
      newButton.innerHTML = icon('plus') + '<span>Turnamen Baru</span>'
      actionsWrap.appendChild(newButton)
    }

    // Bungkus menu + aksi dalam area yang bisa digulir supaya, di jendela
    // pendek, tombol mode dan status di bawah tetap terlihat.
    var navList = nav.querySelector('.nav-list')
    var menuGroup = navList ? navList.parentElement : null
    var navFoot = nav.querySelector('#navFoot')
    if (menuGroup) {
      var scroller = document.createElement('div')
      scroller.className = 'nav-scroll'
      scroller.appendChild(menuGroup)
      scroller.appendChild(actionsWrap)
      nav.insertBefore(scroller, navFoot)
    }
  }

  toggle.addEventListener('click', function () {
    document.body.classList.toggle('nav-open')
  })
  backdrop.addEventListener('click', function () {
    document.body.classList.remove('nav-open')
  })

  // --------------------------------------------------------- pantau render
  var observer = new MutationObserver(function () {
    refresh()
  })
  observer.observe(app, { childList: true, subtree: false })

  // -------------------------------------------- pindahkan kontrol sinkron
  var foot = nav.querySelector('#navFoot')
  var adoptTries = 0
  function adoptSync() {
    var chip = document.getElementById('syncChip')
    var status = document.getElementById('syncStatus')
    if (!chip || !status) {
      adoptTries += 1
      if (adoptTries < 40) setTimeout(adoptSync, 120)
      return
    }
    if (foot) {
      if (status.parentNode !== foot) foot.appendChild(status)
      if (chip.parentNode !== foot) foot.insertBefore(chip, status)
    }
  }
  adoptSync()

  // ------------------------------------------------------------ fullscreen
  function syncFullscreen() {
    var on = Boolean(document.fullscreenElement || document.webkitFullscreenElement)
    document.body.classList.toggle('ui-fullscreen', on)
  }
  document.addEventListener('fullscreenchange', syncFullscreen)
  document.addEventListener('webkitfullscreenchange', syncFullscreen)

  refresh()
  // Beberapa tampilan menggambar ulang setelah requestAnimationFrame pertama.
  setTimeout(refresh, 60)
  setTimeout(refresh, 600)
})()
</script>
